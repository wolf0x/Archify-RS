[package]
name = "archify-rs"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency Archify CLI: architecture visualization from JSON IR, Mermaid, or source repositories, without Node.js"
license = "MIT"
repository = "https://github.com/wolf0x/Archify-RS"
keywords = ["architecture", "diagram", "visualization", "mermaid", "cli"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "archify-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.26", default-features = false }
anyhow = "1"
thiserror = "1"
env_logger = "0.11"
log = "0.4"
walkdir = "2"
pest = "2"
pest_derive = "2"
once_cell = "1"
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
