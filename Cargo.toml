[package]
name = "archify-rs"
version = "0.2.0"
edition = "2021"
description = "Zero-dependency Archify CLI: architecture visualization from JSON IR, Mermaid, or source repositories, without Node.js"
license = "MIT"
repository = "https://github.com/wolf0x/Archify-RS"
keywords = ["architecture", "diagram", "visualization", "mermaid", "cli"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "archify-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.26", default-features = false }
anyhow = "1"
thiserror = "1"
env_logger = "0.11"
log = "0.4"
walkdir = { version = "2", optional = true }
pest = "2"
pest_derive = "2"
once_cell = "1"
tree-sitter = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }

[features]
default = ["analyzer"]
# Repository analyzer: parses source with tree-sitter grammars (adds ~3 MB).
# Build with `--no-default-features` for a minimal binary without `analyze`.
analyzer = [
    "dep:walkdir",
    "dep:tree-sitter",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
panic = "abort"
lto = "fat"
strip = true
codegen-units = 1
